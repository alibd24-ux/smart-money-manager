name: Build Android APK

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Prepare Web Assets & Config (Auto-Detect HTML)
        run: |
          mkdir -p www
          
          # Auto-find index.html (even if named Index.html or something.html)
          HTML_FILE=$(find . -maxdepth 2 -iname "index.html" | head -n 1)
          if [ -z "$HTML_FILE" ]; then
            HTML_FILE=$(find . -maxdepth 2 -iname "*.html" | head -n 1)
          fi
          
          if [ -z "$HTML_FILE" ]; then
            echo "❌ ERROR: কোনো HTML ফাইল পাওয়া যায়নি! রিপোজিটরিতে index.html ফাইল তৈরি করুন।"
            exit 1
          fi
          
          echo "✅ Found HTML file: $HTML_FILE"
          cp "$HTML_FILE" www/index.html

          cat << 'EOF' > package.json
          {
            "name": "smart-money-manager",
            "version": "1.0.0",
            "description": "Smart Money Manager App",
            "private": true
          }
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.smartmoney.tracker",
            "appName": "Smart Money Manager",
            "webDir": "www",
            "bundledWebRuntime": false,
            "android": {
              "allowMixedContent": true
            }
          }
          EOF

      - name: 6. Install Official Capacitor v6 & Create Android Project
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap add android
          npx cap sync android

      - name: 7. Build Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Money-Manager-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
